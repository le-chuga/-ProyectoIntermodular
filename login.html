<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login — Sistema CRUD</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #00e5ff;
    --accent2: #ff3c6e;
    --text: #e8e8f0;
    --muted: #5a5a7a;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.4;
    pointer-events: none;
  }
  .topline {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer { 0%,100%{opacity:.6} 50%{opacity:1} }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 56px 48px;
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.6s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .card-tag {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  h2 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 40px;
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.2s ease;
  }
  input:focus {
    border-color: var(--accent);
  }
  input::placeholder {
    color: var(--muted);
  }

  .btn {
    width: 100%;
    margin-top: 32px;
    padding: 16px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent2);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.3s ease;
  }
  .btn:hover::before { transform: scaleX(1); }
  .btn span { position: relative; z-index: 1; }

  .back {
    display: block;
    text-align: center;
    margin-top: 24px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 1px;
    transition: color 0.2s;
  }
  .back:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="topline"></div>

<div class="card">
  <div class="card-tag">acceso al sistema</div>
  <h2>Login</h2>
  <form action="login.php" method="POST">
    <div class="field">
      <label>Usuario</label>
      <input type="text" name="usuario" placeholder="root" required>
    </div>
    <div class="field">
      <label>Servidor</label>
      <input type="text" name="servidor" placeholder="localhost" required>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" name="clave" placeholder="••••••••">
    </div>
    <button class="btn" type="submit"><span>→ Entrar</span></button>
  </form>
  <a class="back" href="index.html">← Volver al inicio</a>
</div>

</body>
</html>
