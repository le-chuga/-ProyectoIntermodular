<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Productos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin:0; padding:0; font-family:'Poppins', sans-serif; }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    h1 { margin:30px; }

    .container {
      width:90%;
      max-width:1200px;
      display:grid;
      grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
      gap:20px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding:20px;
      border-radius:20px;
    }

    input, button {
      width:100%;
      padding:10px;
      margin:8px 0;
      border:none;
      border-radius:10px;
    }

    button {
      background: linear-gradient(90deg,#00c6ff,#0072ff);
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h1>🚀 CRUD REAL</h1>

<div class="container">

  <!-- LOGIN -->
  <div class="card">
    <h3>🔐 Iniciar Sesión</h3>

    <form action="1_conectarBBDD.php" method="POST">
      <input type="text" name="servidor" placeholder="Servidor" required>
      <input type="text" name="usuario" placeholder="Usuario" required>
      <input type="password" name="clave" placeholder="Contraseña">
      <button>Iniciar Sesión</button>
    </form>
  </div>

  <!-- BD -->
  <div class="card">
    <h3>⚙️ Base de Datos</h3>

    <form action="2_crearBBDD.php" method="GET">
      <button>Crear BD</button>
    </form>

    <form action="3_crearTABLAS.php" method="GET">
      <button>Crear Tablas</button>
    </form>
  </div>

  <!-- PRODUCTO -->
  <div class="card">
    <h3>➕ Producto</h3>
    <form action="5_Insertar_Productos.php" method="POST">
      <input type="text" name="codigoproducto" placeholder="Código" required>
      <input type="text" name="descripcionproducto" placeholder="Descripción" required>
      <input type="text" name="codigoproveedorproducto" placeholder="Proveedor" required>
      <input type="number" name="preciocompraproducto" placeholder="Precio compra" required>
      <input type="number" name="precioventaproducto" placeholder="Precio venta" required>
      <input type="number" name="stockproducto" placeholder="Stock" required>
      <button>Crear</button>
    </form>
  </div>

  <!-- PROVEEDOR -->
  <div class="card">
    <h3>🏢 Proveedor</h3>
    <form action="4_Insertar_Proveedor.php" method="POST">
      <input type="text" name="codigoproveedor" placeholder="Código" required>
      <input type="text" name="nombreproveedor" placeholder="Nombre" required>
      <input type="text" name="direccionproveedor" placeholder="Dirección" required>
      <input type="text" name="telefonoproveedor" placeholder="Teléfono" required>
      <input type="text" name="ciudadproveedor" placeholder="Ciudad" required>
      <input type="text" name="provinciaproveedor" placeholder="Provincia" required>
      <input type="email" name="emailproveedor" placeholder="Email" required>
      <button>Crear</button>
    </form>
  </div>

</div>

</body>
</html>
